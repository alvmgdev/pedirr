name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pedirr
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: pedirr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pedirr -d pedirr"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://pedirr:ci-only-password@localhost:5432/pedirr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: node apps/server/test/integration/users.cjs
      - run: node apps/server/test/integration/requests.cjs
      - run: node apps/server/test/integration/fulfillment.cjs
      - run: node apps/server/test/integration/parts.cjs
      - run: node apps/server/test/integration/worker.cjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm audit --audit-level=moderate
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
